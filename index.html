```html
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Тетрис</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;

      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      overflow: hidden;
      touch-action: none;
    }

    #game {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    canvas {
      border: 2px solid white;
      background: black;

      width: min(240px, 70vw);
      height: auto;

      image-rendering: pixelated;
    }

    #score {
      margin: 10px 0;
      font-size: 20px;
      font-weight: bold;
    }

    /* Кнопки */

    #controls {
      margin-top: 15px;
      display: grid;
      grid-template-columns: repeat(3, 70px);
      grid-template-rows: repeat(2, 60px);
      gap: 8px;
      justify-content: center;
    }

    button {
      border: 2px solid #555;
      border-radius: 12px;
      background: #222;
      color: white;

      font-size: 28px;
      font-weight: bold;

      user-select: none;
      -webkit-user-select: none;

      touch-action: manipulation;
    }

    button:active {
      background: #444;
      transform: scale(0.95);
    }

    #left {
      grid-column: 1;
      grid-row: 2;
    }

    #down {
      grid-column: 2;
      grid-row: 2;
    }

    #right {
      grid-column: 3;
      grid-row: 2;
    }

    #rotateLeft {
      grid-column: 1;
      grid-row: 1;
    }

    #rotateRight {
      grid-column: 3;
      grid-row: 1;
    }

    #restart {
      margin-top: 12px;
      width: 220px;
      height: 45px;
      font-size: 18px;
    }

    /* На компьютере */

    @media (min-width: 700px) {
      canvas {
        width: 240px;
      }

      #controls {
        display: none;
      }

      #restart {
        display: none;
      }
    }

    /* Маленькие телефоны */

    @media (max-height: 650px) {
      canvas {
        width: min(200px, 60vw);
      }

      #controls {
        margin-top: 8px;
        grid-template-columns: repeat(3, 60px);
        grid-template-rows: repeat(2, 50px);
      }

      button {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

  <div id="game">

    <canvas id="tetris" width="240" height="400"></canvas>

    <div id="score">Счёт: 0</div>

    <div id="controls">

      <button id="rotateLeft">↺</button>

      <button id="rotateRight">↻</button>

      <button id="left">◀</button>

      <button id="down">▼</button>

      <button id="right">▶</button>

    </div>

    <button id="restart">🔄 Новая игра</button>

  </div>


  <script>

    const canvas = document.getElementById('tetris');
    const context = canvas.getContext('2d');

    context.scale(20, 20);


    function arenaSweep() {

      let rowCount = 1;

      outer:
      for (let y = arena.length - 1; y >= 0; --y) {

        for (let x = 0; x < arena[y].length; ++x) {

          if (arena[y][x] === 0)
            continue outer;

        }

        const row = arena.splice(y, 1)[0].fill(0);

        arena.unshift(row);

        ++y;

        player.score += rowCount * 10;

        rowCount *= 2;
      }
    }


    function collide(arena, player) {

      const [m, o] = [player.matrix, player.pos];

      for (let y = 0; y < m.length; ++y) {

        for (let x = 0; x < m[y].length; ++x) {

          if (
            m[y][x] !== 0 &&
            (
              arena[y + o.y] &&
              arena[y + o.y][x + o.x]
            ) !== 0
          ) {

            return true;
          }
        }
      }

      return false;
    }


    function createMatrix(w, h) {

      const matrix = [];

      while (h--)
        matrix.push(new Array(w).fill(0));

      return matrix;
    }


    function createPiece(type) {

      if (type === 'T')
        return [
          [0, 1, 0],
          [1, 1, 1],
          [0, 0, 0]
        ];

      if (type === 'O')
        return [
          [2, 2],
          [2, 2]
        ];

      if (type === 'L')
        return [
          [0, 3, 0],
          [0, 3, 0],
          [0, 3, 3]
        ];

      if (type === 'J')
        return [
          [0, 4, 0],
          [0, 4, 0],
          [4, 4, 0]
        ];

      if (type === 'I')
        return [
          [0, 5, 0, 0],
          [0, 5, 0, 0],
          [0, 5, 0, 0],
          [0, 5, 0, 0]
        ];

      if (type === 'S')
        return [
          [0, 6, 6],
          [6, 6, 0],
          [0, 0, 0]
        ];

      if (type === 'Z')
        return [
          [7, 7, 0],
          [0, 7, 7],
          [0, 0, 0]
        ];
    }


    function drawMatrix(matrix, offset) {

      matrix.forEach((row, y) => {

        row.forEach((value, x) => {

          if (value !== 0) {

            context.fillStyle = colors[value];

            context.fillRect(
              x + offset.x,
              y + offset.y,
              1,
              1
            );

            /* Небольшая рамка блока */

            context.strokeStyle = 'rgba(0,0,0,0.25)';

            context.lineWidth = 0.05;

            context.strokeRect(
              x + offset.x,
              y + offset.y,
              1,
              1
            );
          }

        });

      });
    }


    function draw() {

      context.fillStyle = '#000';

      context.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

      drawMatrix(
        arena,
        {x: 0, y: 0}
      );

      drawMatrix(
        player.matrix,
        player.pos
      );
    }


    function merge(arena, player) {

      player.matrix.forEach((row, y) => {

        row.forEach((value, x) => {

          if (value !== 0) {

            arena[
              y + player.pos.y
            ][
              x + player.pos.x
            ] = value;

          }

        });

      });
    }


    function rotate(matrix, dir) {

      for (
        let y = 0;
        y < matrix.length;
        ++y
      ) {

        for (
          let x = 0;
          x < y;
          ++x
        ) {

          [
            matrix[x][y],
            matrix[y][x]
          ] = [
            matrix[y][x],
            matrix[x][y]
          ];

        }
      }

      if (dir > 0) {

        matrix.forEach(row =>
          row.reverse()
        );

      } else {

        matrix.reverse();

      }
    }


    function playerDrop() {

      player.pos.y++;

      if (collide(arena, player)) {

        player.pos.y--;

        merge(arena, player);

        playerReset();

        arenaSweep();

        updateScore();
      }

      dropCounter = 0;
    }


    function playerMove(dir) {

      player.pos.x += dir;

      if (collide(arena, player)) {

        player.pos.x -= dir;
      }
    }


    function playerReset() {

      const pieces = 'TJLOSZI';

      player.matrix =
        createPiece(
          pieces[
            Math.floor(
              Math.random() * pieces.length
            )
          ]
        );

      player.pos.y = 0;

      player.pos.x =
        Math.floor(arena[0].length / 2) -
        Math.floor(player.matrix[0].length / 2);


      if (collide(arena, player)) {

        arena.forEach(row =>
          row.fill(0)
        );

        player.score = 0;

        updateScore();
      }
    }


    function playerRotate(dir) {

      const pos = player.pos.x;

      let offset = 1;

      rotate(
        player.matrix,
        dir
      );

      while (
        collide(arena, player)
      ) {

        player.pos.x += offset;

        offset =
          -(offset +
          (offset > 0 ? 1 : -1));

        if (
          offset >
          player.matrix[0].length
        ) {

          rotate(
            player.matrix,
            -dir
          );

          player.pos.x = pos;

          return;
        }
      }
    }


    let dropCounter = 0;

    let dropInterval = 1000;

    let lastTime = 0;


    function update(time = 0) {

      const deltaTime =
        time - lastTime;

      lastTime = time;

      dropCounter += deltaTime;


      if (
        dropCounter >
        dropInterval
      ) {

        playerDrop();
      }


      draw();

      requestAnimationFrame(update);
    }


    function updateScore() {

      document.getElementById('score')
        .textContent =
        'Счёт: ' + player.score;

      document.title =
        'Тетрис | Счёт: ' +
        player.score;
    }


    const colors = [

      null,

      '#FF0D72',

      '#0DC2FF',

      '#0DFF72',

      '#F538FF',

      '#FF8E0D',

      '#FFE138',

      '#3877FF'

    ];


    const arena =
      createMatrix(12, 20);


    const player = {

      pos: {
        x: 0,
        y: 0
      },

      matrix: null,

      score: 0

    };


    /* Клавиатура компьютера */

    document.addEventListener(
      'keydown',
      e => {

        if (e.code === 'ArrowLeft') {

          playerMove(-1);

        }

        else if (
          e.code === 'ArrowRight'
        ) {

          playerMove(1);

        }

        else if (
          e.code === 'ArrowDown'
        ) {

          playerDrop();

        }

        else if (
          e.code === 'KeyQ'
        ) {

          playerRotate(-1);

        }

        else if (
          e.code === 'KeyW'
        ) {

          playerRotate(1);

        }

      }
    );


    /*
      Управление телефоном
    */

    function mobileButton(
      id,
      action
    ) {

      const button =
        document.getElementById(id);


      button.addEventListener(
        'touchstart',
        function(e) {

          e.preventDefault();

          action();

        },
        { passive: false }
      );


      /* Также работает мышкой */

      button.addEventListener(
        'mousedown',
        function(e) {

          e.preventDefault();

          action();

        }
      );

    }


    mobileButton(
      'left',
      () => playerMove(-1)
    );


    mobileButton(
      'right',
      () => playerMove(1)
    );


    mobileButton(
      'down',
      () => playerDrop()
    );


    mobileButton(
      'rotateLeft',
      () => playerRotate(-1)
    );


    mobileButton(
      'rotateRight',
      () => playerRotate(1)
    );


    /* Новая игра */

    document
      .getElementById('restart')
      .addEventListener(
        'click',
        () => {

          arena.forEach(row =>
            row.fill(0)
          );

          player.score = 0;

          playerReset();

          updateScore();

        }
      );


    playerReset();

    updateScore();

    update();

  </script>

</body>
</html>
